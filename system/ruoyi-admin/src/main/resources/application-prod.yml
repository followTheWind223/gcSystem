# 部署时注入环境变量，不复制开发机的 .env。
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
spring:
  datasource:
    druid:
      master:
        url: ${DB_URL}
        username: ${DB_USERNAME}
        password: ${DB_PASSWORD}
  devtools:
    restart:
      enabled: false
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
