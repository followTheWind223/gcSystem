openapi: 3.0.3
info:
  title: gcSystem 游戏道具商城接口契约
  version: 3.0.0
  description: 商城与后台统一使用若依认证。商城账号通过 sys_user_id 关联业务档案；普通角色 common 仅可使用用户端。V007 迁移保留历史会员与交易主键。
servers:
- url: http://127.0.0.1:8080
  description: 本机后端；商城实现位于 gameshop，REST 契约 2.0.0
- url: /
  description: 同源开发代理或部署反向代理
tags:
- name: 会员认证
- name: 会员资料
- name: 公开门户
- name: 公开媒体
- name: 购物车
- name: 订单与模拟支付
- name: 评价
- name: 后台商品与内容
- name: 后台会员
- name: 后台订单
- name: 后台评价与库存
- name: 已有若依后台
- name: 后台游戏区服
  description: 游戏维度的交付区服配置
