  /api/mall/orders/{orderNo}/payments:
    post:
      operationId: memberMockPay
      summary: 模拟支付成功或失败
      description: 只在 payment.mode=mock 时启用，不发生真实扣款。SUCCESS 仅对未到期待支付单完成 1→2，写唯一支付事实、增加销量，不再扣库存；重复 SUCCESS 读取原支付记录（状态 2/4 均可）。FAIL
        不改订单且不记成功支付事实，HTTP 200/outcome=FAILED；已支付单传 FAIL 返回状态冲突。支付与取消/到期竞争只有一种合法结果。
      tags:
      - 订单与模拟支付
      security:
      - RuoYiBearer: []
      x-implementation-status: implemented
