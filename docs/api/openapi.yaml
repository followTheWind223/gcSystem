components:
  securitySchemes:
    RuoYiBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 若依 /login 签发的统一令牌；后台接口另校验管理权限，商城通过 sys_user_id 关联 member_id。
  parameters:
    pageNum:
      name: pageNum
      in: query
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100000
        default: 1
      description: 页码，从 1 开始；超出末页返回空 rows。
    pageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 50
        default: 10
      description: 每页条数，最大 50。
